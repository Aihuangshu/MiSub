name: Fork Sync

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync_with_upstream:
    name: Sync upstream + reapply Worker overlay
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}

    steps:
      - name: Checkout fork
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.SYNC_PAT != '' && secrets.SYNC_PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          ref: main

      - name: Configure remotes
        env:
          SYNC_PAT: ${{ secrets.SYNC_PAT }}
        run: |
          set -euo pipefail
          git config user.name "GitHub Actions Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote remove upstream >/dev/null 2>&1 || true
          git remote add upstream https://github.com/imzyb/MiSub.git
          git remote set-url origin "https://github.com/${{ github.repository }}.git"
          if [ -n "${SYNC_PAT:-}" ]; then
            git remote set-url origin "https://x-access-token:${SYNC_PAT}@github.com/${{ github.repository }}.git"
          fi
          git fetch --prune upstream main
          git fetch --prune origin main
          git fetch --prune origin workers-overlay

      - name: Mirror upstream and reapply local overlay
        run: |
          set -euo pipefail
          git checkout main
          git reset --hard upstream/main

          OVERLAY_FILES=(
            "worker-runtime/worker.js"
            "scripts/build-misub-worker.sh"
            ".github/workflows/fork-sync.yml"
            ".github/workflows/misub-worker-deploy.yml"
            "docs/WORKERS_MIGRATION.md"
          )

          for file in "${OVERLAY_FILES[@]}"; do
            git checkout origin/workers-overlay -- "${file}"
          done

          git add "${OVERLAY_FILES[@]}"
          if git diff --cached --quiet; then
            echo "✅ Upstream 与 Worker overlay 均无变化。"
            exit 0
          fi

          git commit -m "Apply local Worker overlay"
          git push --force-with-lease origin main
          echo "Worker overlay applied to main."