name: MiSub Worker Deploy

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Fork Sync"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout synchronized main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build MiSub Worker bundle
        run: bash scripts/build-misub-worker.sh

      - name: Verify Worker build
        run: |
          set -euo pipefail
          test -f dist/index.html
          grep -q "/misub/" dist/index.html
          echo "MiSub Worker build verified."

      - name: Verify legacy Pages bindings and current routes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          project_url="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/misub"
          domains_url="${project_url}/domains"

          project_status="$(curl -sS -o /tmp/misub-pages.json -w '%{http_code}' \
            "${project_url}" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json")"

          if [ "${project_status}" = "404" ]; then
            echo "Legacy Pages project 'misub' not found; skipping legacy binding check."
          elif [ "${project_status}" != "200" ]; then
            echo "Cloudflare Pages API returned HTTP ${project_status}."
            cat /tmp/misub-pages.json
            exit 1
          else
            domains_status="$(curl -sS -o /tmp/misub-pages-domains.json -w '%{http_code}' \
              "${domains_url}" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json")"

            if [ "${domains_status}" != "200" ]; then
              echo "Cloudflare Pages domains API returned HTTP ${domains_status}."
              cat /tmp/misub-pages-domains.json
              exit 1
            fi

            python3 - <<'PY'
            import json
            import re
            from pathlib import Path

            project = json.loads(Path("/tmp/misub-pages.json").read_text())
            domains = json.loads(Path("/tmp/misub-pages-domains.json").read_text())

            result = project.get("result") or {}
            prod = (result.get("deployment_configs") or {}).get("production") or {}
            kv = ((prod.get("kv_namespaces") or {}).get("MISUB_KV") or {}).get("namespace_id")
            d1 = ((prod.get("d1_databases") or {}).get("MISUB_DB") or {}).get("id")

            wrangler = Path("worker-runtime/wrangler.toml").read_text()
            kv_match = re.search(r'(?ms)^\\[\\[kv_namespaces\\]\\].*?^id\\s*=\\s*"([^"]+)"', wrangler)
            d1_match = re.search(r'(?ms)^\\[\\[d1_databases\\]\\].*?^database_id\\s*=\\s*"([^"]+)"', wrangler)

            if not kv_match:
                raise SystemExit("Unable to parse Worker KV ID from wrangler.toml")

            worker_kv = kv_match.group(1)
            worker_d1 = d1_match.group(1) if d1_match else None
            domain_names = [item.get("name") for item in (domains.get("result") or []) if item.get("name")]

            print(f"Legacy Pages project: {result.get('name', 'misub')}")
            print(f"Legacy Pages KV MISUB_KV: {kv}")
            print(f"Worker KV MISUB_KV:      {worker_kv}")
            print(f"Legacy Pages D1 MISUB_DB: {d1}")
            print(f"Worker D1 MISUB_DB:       {worker_d1}")
            print("Legacy Pages domains:")
            for name in domain_names:
                print(f"  - {name}")

            if kv != worker_kv:
                raise SystemExit("KV mismatch: Worker is not using the legacy Pages production MISUB_KV namespace.")
            if d1 != worker_d1:
                raise SystemExit("D1 mismatch: Worker D1 binding differs from legacy Pages production.")
            print("Legacy Pages storage bindings match Worker configuration.")
            PY

          zone_status="$(curl -sS -o /tmp/zone.json -w '%{http_code}' \
            "https://api.cloudflare.com/client/v4/zones?name=nua.qzz.io" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json")"

          if [ "${zone_status}" = "200" ]; then
            python3 - <<'PY'
            import json
            from pathlib import Path

            data = json.loads(Path("/tmp/zone.json").read_text())
            zones = data.get("result") or []
            if zones:
                zone_id = zones[0].get("id")
                print(f"Zone nua.qzz.io ID: {zone_id}")
                Path("/tmp/zone-id").write_text(zone_id or "")
            else:
                print("Zone nua.qzz.io was not returned by Cloudflare API.")
            PY
          else
            echo "Cloudflare Zones API returned HTTP ${zone_status}; route diagnostics skipped."
          fi

          if [ -s /tmp/zone-id ]; then
            zone_id="$(cat /tmp/zone-id)"
            routes_status="$(curl -sS -o /tmp/routes.json -w '%{http_code}' \
              "https://api.cloudflare.com/client/v4/zones/${zone_id}/workers/routes" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json")"

            if [ "${routes_status}" = "200" ]; then
              python3 - <<'PY'
              import json
              from pathlib import Path

              data = json.loads(Path("/tmp/routes.json").read_text())
              routes = data.get("result") or []
              print("Current Worker routes for nua.qzz.io:")
              for route in routes:
                  print(f"  - {route.get('pattern')} -> {route.get('script') or '<no script>'}")
              PY
            else
              echo "Cloudflare Workers Routes API returned HTTP ${routes_status}; route diagnostics skipped."
            fi
          fi

      - name: Deploy Worker + Routes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config worker-runtime/wrangler.toml
