name: MiSub Worker Deploy

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Fork Sync"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout synchronized main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build MiSub Worker bundle
        run: bash scripts/build-misub-worker.sh

      - name: Verify Worker build
        run: |
          set -euo pipefail
          test -f dist/index.html
          grep -q "/misub/" dist/index.html
          echo "MiSub Worker build verified."

      - name: Deploy Worker + Routes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config worker-runtime/wrangler.toml

